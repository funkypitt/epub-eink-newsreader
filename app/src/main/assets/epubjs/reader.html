<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100vh; overflow: hidden; background: #ffffff; color: #000000; }
  /* position: fixed + inset:0 gives #viewer dimensions relative to the
     WebView's visual viewport directly. Android WebView resolves 100vh
     and 100vw to 0 in this configuration, so the four anchors are what
     stretch #viewer to the visible area. */
  #viewer {
    position: fixed; inset: 0;
    overflow: hidden;
  }
  #loading {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: monospace; font-size: 12px; color: #888;
    z-index: 5;
  }
</style>
<script src="jszip.min.js"></script>
<script src="epub.min.js"></script>
</head>
<body>
<div id="viewer"></div>
<div id="loading">Loading…</div>
<script>
// epub.js host page for the Magazine Reader.
//
// Pagination approach (inspired by Readium, BSD-3-Clause):
// epub.js loads the chapter in scrolled-doc mode for reliable content
// rendering — its native paginated mode clips content past N columns
// on Android WebView. After the chapter is displayed we apply CSS
// multi-column layout to the iframe body ourselves and navigate with
// body.scrollLeft. Using overflow:auto (not hidden) forces the browser
// to lay out every column even when they are far off-screen.
//
// Fragmentation CSS (orphans, widows, break-inside) prevents lines and
// block elements from being cut at column boundaries — the browser
// handles line-breaking natively, so no overlap hack is needed.

function trace(stage, detail) {
  try {
    console.log("[mr] " + stage + (detail !== undefined ? ": " + detail : ""));
  } catch (_) {}
}

window.onerror = function (message, source, lineno) {
  trace("window.onerror", (message || "") + " @ " + (source || "?") + ":" + (lineno || "?"));
  return false;
};
window.addEventListener("unhandledrejection", function (e) {
  var r = e && e.reason;
  trace("unhandledrejection", r && (r.message || r) || "(no reason)");
});

var book = null;
var rendition = null;
var pendingHref = null;
var currentFontSize = 18;
var isNavigating = false;
var bookReady = false;

// Column-pagination state
var colBody = null;   // the iframe <body> we paginate
var pageW = 0;        // scroll step per page (= viewport width)
var curPage = 0;
var setupTimer = null;
var pendingFontSize = 0;

function notify(name, payload) {
  try {
    if (window.MagazineReader && window.MagazineReader[name]) {
      window.MagazineReader[name](payload || "");
    }
  } catch (_) {}
}

// Normalise a chapter's source text into well-formed XHTML so the
// strict XML parser epub.js uses never bails out to its error page.
//
// 1. A targeted fix for the Economist's broken drop-cap markup, run
//    first so the styled initial keeps rendering correctly (the generic
//    pass below would otherwise treat the stray "<" as literal text and
//    drop the styling).
// 2. A generic round-trip through the browser's lenient HTML5 parser,
//    re-serialised as XML. This closes unclosed tags, fixes mismatched
//    nesting, escapes stray "<" / "&", and self-closes void elements —
//    covering every malformed-markup variant, not just known patterns.
//
// If anything in the generic pass throws or yields nothing usable, we
// fall back to the lightly-repaired text rather than risk a blank page.
function repairChapterXhtml(text) {
  text = text.replace(
    /<span class="drop-cap"><<\/span>b>([A-Za-z])<\/b>/g,
    "<span class=\"drop-cap\">$1</span>"
  );
  try {
    var htmlDoc = new DOMParser().parseFromString(text, "text/html");
    if (htmlDoc && htmlDoc.documentElement) {
      var xml = new XMLSerializer().serializeToString(htmlDoc);
      if (xml && xml.indexOf("<html") !== -1) return xml;
    }
  } catch (e) {
    trace("repairChapterXhtml.threw", e && (e.message || e));
  }
  return text;
}

function loadBook(base64Data, href) {
  bookReady = false;
  pendingFontSize = 0;
  pendingHref = href || null;
  trace("loadBook.entered", "href=" + (href || "(none)") +
    " base64Length=" + (base64Data ? base64Data.length : 0));
  try {
    if (typeof ePub !== "function") {
      throw new Error("epub.js not loaded — typeof ePub=" + (typeof ePub));
    }
    var raw = atob(base64Data);
    var len = raw.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = raw.charCodeAt(i);

    book = ePub(bytes.buffer);

    // Repair producer-side HTML defects before each chapter is parsed
    // as XHTML. epub.js feeds the returned text straight to
    // parseFromString(..., "application/xhtml+xml"), whose strict XML
    // parser renders a "StartTag: invalid element name" error page for
    // any malformed markup (stray "<" in text, unclosed/mismatched tags,
    // bad void elements). The Economist and several other magazines ship
    // such defects. archive.getText is the entry point epub.js calls for
    // every chapter's source text.
    if (book.archive) {
      var origGetText = book.archive.getText.bind(book.archive);
      book.archive.getText = function (path, encoding) {
        var result = origGetText(path, encoding);
        if (!/\.x?html?$/i.test(path || "")) return result;
        return Promise.resolve(result).then(function (text) {
          if (typeof text !== "string") return text;
          return repairChapterXhtml(text);
        });
      };
    }

    rendition = book.renderTo("viewer", {
      width: "100%",
      height: "100%",
      flow: "scrolled-doc",
      allowScriptedContent: true
    });

    rendition.themes.fontSize(currentFontSize + "px");
    rendition.themes.default({
      "body": { "line-height": "1.6 !important" },
      "img, figure, video": { "max-width": "100% !important", "height": "auto !important" }
    });

    rendition.on("relocated", function (location) {
      isNavigating = false;
      try { notify("onRelocated", location.start.cfi || ""); } catch (_) {}
    });

    rendition.on("displayed", function () {
      scheduleSetup();
    });

    book.ready.then(function () {
      var hide = document.getElementById("loading");
      if (hide) hide.style.display = "none";
      return rendition.display();
    }).then(function () {
      notify("onReady", "");
      if (pendingHref) return rendition.display(pendingHref);
    }).then(function () {
      bookReady = true;
      if (pendingFontSize > 0) {
        setFontSize(pendingFontSize);
        pendingFontSize = 0;
      }
    }).catch(function (e) {
      trace("ready/display-rejected", e && (e.message || e));
      notify("onError", "ready: " + (e && e.message || e));
    });
  } catch (e) {
    trace("loadBook.threw", e && (e.message || e));
    notify("onError", "loadBook: " + (e && e.message || e));
  }
}

// ── Column pagination ──────────────────────────────────────────────

function scheduleSetup() {
  if (setupTimer) clearTimeout(setupTimer);
  setupTimer = setTimeout(setupPagination, 150);
}

function setupPagination() {
  var iframes = document.querySelectorAll("#viewer iframe");
  if (!iframes.length) { trace("paginate", "no iframes"); return; }
  var iframe = iframes[iframes.length - 1];
  var doc = iframe.contentDocument;
  if (!doc || !doc.body) { trace("paginate", "no doc/body"); return; }

  // Freeze the epub-container's vertical scroll — we paginate
  // horizontally inside the iframe instead.
  var el = iframe.parentElement;
  while (el && el !== document.body) {
    if (el.scrollHeight > el.clientHeight + 1) {
      el.style.overflowY = "hidden";
      el.scrollTop = 0;
      break;
    }
    el = el.parentElement;
  }

  var viewer = document.getElementById("viewer");
  var vw = viewer.clientWidth || window.innerWidth;
  var vh = viewer.clientHeight || window.innerHeight;
  if (vw < 10 || vh < 10) { trace("paginate", "bad dims"); return; }

  // epub.js sizes the iframe while the stage container still has
  // overflow-y:scroll, which can make the iframe narrower than the
  // viewer.  Force it (and its wrapper) to fill the viewer so our
  // column maths match the actual available width.
  iframe.style.setProperty("width", vw + "px", "important");
  iframe.style.setProperty("height", vh + "px", "important");
  var iframeWrap = iframe.parentElement;
  if (iframeWrap && iframeWrap !== viewer) {
    iframeWrap.style.setProperty("width", vw + "px", "important");
    iframeWrap.style.setProperty("height", vh + "px", "important");
  }

  // Padding that doubles as the column gap: each page shows
  // [PAD] column-content [PAD], with the gap split evenly between
  // adjacent pages so every page has equal margins.
  var PAD = Math.max(8, Math.min(32, Math.round(vw * 0.04)));
  var GAP = 2 * PAD;
  var colW = vw - GAP;

  var html = doc.documentElement;
  var body = doc.body;

  html.style.setProperty("overflow", "hidden", "important");
  html.style.setProperty("height", vh + "px", "important");
  html.style.setProperty("margin", "0", "important");

  // Column layout on <body>.  overflow:auto forces WebView to render
  // every column (overflow:hidden + column-fill:auto caused it to
  // skip columns far from the viewport on earlier Android versions).
  body.style.setProperty("height", vh + "px", "important");
  body.style.setProperty("max-height", vh + "px", "important");
  body.style.setProperty("margin", "0", "important");
  body.style.setProperty("padding", PAD + "px", "important");
  body.style.setProperty("box-sizing", "border-box", "important");
  body.style.setProperty("overflow", "auto", "important");
  body.style.setProperty("column-width", colW + "px", "important");
  body.style.setProperty("column-gap", GAP + "px", "important");
  body.style.setProperty("column-fill", "auto", "important");
  body.style.setProperty("scrollbar-width", "none", "important");
  // Prevent descender/ascender clipping at column boundaries (Readium technique)
  body.style.setProperty("-webkit-line-box-contain", "block glyphs replaced", "important");

  // Fragmentation rules + scrollbar hide
  var id = "mr-col-css";
  var prev = doc.getElementById(id);
  if (prev) prev.remove();
  var s = doc.createElement("style");
  s.id = id;
  s.textContent =
    "body::-webkit-scrollbar { display: none !important; }\n" +
    "* { orphans: 2 !important; widows: 2 !important; }\n" +
    "h1, h2, h3, h4, h5, h6 { break-after: avoid !important; }\n" +
    "h1, h2, h3, h4, h5, h6, img, figure, table, pre, blockquote { break-inside: avoid !important; }\n" +
    "img, figure, video { max-width: 100% !important; height: auto !important; break-inside: avoid !important; }\n";
  doc.head.appendChild(s);

  colBody = body;
  // The column pitch is exactly vw by construction: colW = vw - GAP and
  // column-gap = GAP, so each column's left edge sits at k*vw. The scroll
  // step is therefore always vw — never interpolated from scrollWidth.
  // Deriving the step from scrollWidth (as a previous version did) drifts
  // off the column boundary whenever scrollWidth isn't an exact multiple
  // of vw (sub-pixel rounding, a non-breaking wide image/table, or a
  // not-yet-settled layout), which leaks a sliver of the next column plus
  // a white gap onto the right edge of the page.
  pageW = vw;
  curPage = 0;
  body.scrollLeft = 0;

  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      var sw = body.scrollWidth;
      var pages = Math.max(1, Math.round(sw / vw));
      trace("paginate", "vw=" + vw + " vh=" + vh + " pad=" + PAD +
        " pages=" + pages + " pageW=" + pageW + " scrollW=" + sw);
    });
  });
}

function goNext() {
  if (!colBody || pageW < 1) return;
  // Count pages from a live scrollWidth read (handles late reflow from
  // image/font loading), but scroll to the exact column boundary.
  var pages = Math.max(1, Math.round(colBody.scrollWidth / pageW));
  if (curPage >= pages - 1) return;
  curPage++;
  colBody.scrollLeft = curPage * pageW;
}

function goPrev() {
  if (!colBody || curPage <= 0) return;
  curPage--;
  colBody.scrollLeft = curPage * pageW;
}

function goToHref(href) {
  pendingHref = href;
  colBody = null;
  curPage = 0;
  if (rendition) rendition.display(href);
}

function setFontSize(px) {
  currentFontSize = Math.max(10, Math.min(40, px | 0));
  if (!bookReady) {
    pendingFontSize = currentFontSize;
    return;
  }
  if (rendition) {
    rendition.themes.fontSize(currentFontSize + "px");
    scheduleSetup();
  }
}

window.loadBook = loadBook;
window.goNext = goNext;
window.goPrev = goPrev;
window.goToHref = goToHref;
window.setFontSize = setFontSize;
</script>
</body>
</html>
